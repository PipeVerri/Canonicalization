name: canonicalization
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - cpython
  - pip
  - minimap2
  - ncbi-datasets-cli
  - optuna
  - pip:
    - -r requirements.txt
    - torch==2.1.0
    - torchvision==0.16.0
    - torchaudio==2.1.0
    - pytorch-lightning==1.8.6
    - "setuptools>=61.0,<68.0.0" # For pkg_resources and editable installation
    - -e .

# Flash Attention is optional; install a wheel compatible with Python, PyTorch, and CUDA if needed.
