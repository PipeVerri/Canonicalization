# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /dataset: chromatin_profile
  - /optimizer: adamw
  - /scheduler: plateau
  - /callbacks: [base, checkpoint]

train:
  monitor: val/auroc
  mode: max
  compute_train_torchmetrics: False

task:
  _name_: base
  loss: binary_cross_entropy
  metrics:
    - auroc

encoder: id

# we need this for classification!
decoder:
  _name_: sequence
  mode: pool