_name_: bend_benchmark
# Provide a sensible default for `dataset_dir` so tasks can access it.
# This can still be overridden by an experiment or environment variable.

dataset_name: ???
h5_path: ???

pool_mode: "snp" # Only applies to the zero shot tasks

decoder: ${.${.dataset_name}.decoder}
task: ${.${.dataset_name}.task}

max_length: ${.${.dataset_name}.max_length}
d_output: ${.${.dataset_name}.classes}

use_padding: True
padding_side: right
return_mask: True

add_eos: False
train_len: ${.${.dataset_name}.train_len} # Taken from table 1 of the BEND paper
__l_max: ${.max_length}
shuffle: true  # set this as default!
metric: ${.${.dataset_name}.metric}
batch_size: ${.${.dataset_name}.batch_size}

use_control_signal: False
control_signals_dir: ${oc.env:PROJECT_ROOT}/data/bend_benchmark_parsed/raw_control_signals/

# Details taken from BEND's paper, table 1
# The genome used was taken from https://anonymous.4open.science/r/BEND-8C42/conf/embedding/embed.yaml
cpg_methylation:
  metric: auroc
  train_len: 4780
  max_length: 512
  classes: 7
  batch_size: 256

  decoder:
    _name_: sequence
    mode: pool
  task:
    _name_: base
    loss: binary_cross_entropy
    metrics:
      - auroc

gene_finding:
  metric: mcc
  train_len: 109717
  max_length: 16_384 # Taken from ConvNova paper
  classes: 9
  batch_size: 8

  decoder:
    _name_: bend_linear
  task:
    _name_: lm
    loss: cross_entropy
    metrics:
      - mcc

variant_effects_disease:
  bed_path: ${..dataset_dir}/variant_effects_disease.bed
  decoder_name: sequence
  max_length: 512
  classes: 2

  metric: null
  decoder: null
  task:
    _name_: base
    loss: binary_cross_entropy

variant_effects_expression:
  bed_path: ${..dataset_dir}/variant_effects_expression.bed
  max_length: 512
  classes: 2

  metric: null
  decoder: null
  task:
    _name_: base
    loss: binary_cross_entropy