[project]
name = "convnova"
version = "0.1.0"
description = "ConvNova research project"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
