# @package _global_
defaults:
  - /dataset@canonicalization.nt_benchmark.dataset: nucleotide_transformer
  - /dataset@canonicalization.genomic_benchmark.dataset: genomic_benchmark
  - /dataset@canonicalization.bend_benchmark.dataset: bend_benchmark
  - /dataset@canonicalization.deepsea.dataset: chromatin_profile
  - _self_

# If I reverse a downstream task sequence, and then it gets trimmed, the model may not be seeing the part of the sequence that it would have seen originally
# That's why, when canonicalizing, I trim the sequences first so that doesn't happen
# The default blocks above imports the downstream tasks datasets into the config, and I can access their max lengths to trim them

canonicalization:
  # Canonicalization config
  annotations_level: 2 # 1 for experimentally confirmed, 2 for +human annotations, 3 for +in silico annotations
  include_cdjv_segments: false
  include_pseudogenes: True
  include_na_transcript_type: false
  transformation: "rc"  # reverse, complement, rc
  num_workers: 16

  # Check the discussion section for more details
  overlap_transformation_behavior: "both_break" # partial_break, full_break, both_break
  keep_segments_order: True # Inert when overlap_break_behavior is set to partial_break
  full_break_config:
    orient_all_segments: True
  
  data_path: ${oc.env:PROJECT_ROOT}/data/
  pretraining_fasta_file: ${.data_path}/hg38/GRCh38.primary_assembly.genome.fa
  pretraining_fasta_output_dir: ${.data_path}/parsed/
  sequence_ontology_file: ${.data_path}/so.obo

  # Downstream tasks canonicalization config
  partial_downstream_canonicalization: false

  nt_benchmark:
    input_dir: ${..data_path}/nucleotide_transformer
    output_dir: ${..data_path}/nucleotide_transformer_parsed/
    skip_tasks: ["promoter_all", "promoter_tata", "promoter_no_tata", "splice_sites_all", "splice_sites_donors", "splice_sites_acceptors"]

  genomic_benchmark:
    input_dir: ${..data_path}/genomic_benchmark/
    output_dir: ${..data_path}/genomic_benchmark_parsed/
    skip_tasks: ["human_nontata_promoters"] # Should maybe include the OCR task

  bend_benchmark:
    input_dir: ${..data_path}/bend_benchmark/
    output_dir: ${..data_path}/bend_benchmark_parsed/
    skip_tasks: ["variant_effects_disease", "variant_effects_expression"] # The SNP may break when transforming the sequence
  
  deepsea:
    input_dir: ${..data_path}/deepsea/
    output_dir: ${..data_path}/deepsea_parsed/

  # Reference genomes config
  hg38:
    index_file: ${..data_path}/hg38_index.mmi
    gff_file: ${..data_path}/hg38/gencode.v50.primary_assembly.annotation.gff3
    sequence_report_file: ${..data_path}/hg38/ncbi_dataset/data/GCF_000001405.26/sequene_report.jsonl
    is_gff_from_ncbi: False # For the column names
    rename_gff_using_seq_report: False

  mouse:
    index_file: ${..data_path}/mouse_index.mmi
    gff_file: ${..data_path}/mouse/gencode.vM39.primary_assembly.annotation.gff3
    sequence_report_file: ${..data_path}/mouse/ncbi_dataset/data/GCF_000001635.27/sequence_report.jsonl
    is_gff_from_ncbi: False
    rename_gff_using_seq_report: False
  
  drosophila:
    index_file: ${..data_path}/drosophila_index.mmi
    gff_file: ${..data_path}/drosophila/ncbi_dataset/data/GCF_000001215.4/genomic.gff
    sequence_report_file: ${..data_path}/drosophila/ncbi_dataset/data/GCF_000001215.4/sequence_report.jsonl
    is_gff_from_ncbi: True
    rename_gff_using_seq_report: False # No need to rename because the index is done using NCBI's genome
  
  roundworm:
    index_file: ${..data_path}/roundworm_index.mmi
    gff_file: ${..data_path}/roundworm/ncbi_dataset/data/GCF_000002985.6/genomic.gff
    sequence_report_file: ${..data_path}/roundworm/ncbi_dataset/data/GCF_000002985.6/sequence_report.jsonl
    is_gff_from_ncbi: True
    rename_gff_using_seq_report: False