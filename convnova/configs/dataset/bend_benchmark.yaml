_name_: bend_benchmark
# Provide a sensible default for `dataset_dir` so tasks can access it.
# This can still be overridden by an experiment or environment variable.
dataset_dir: ???
dataset_name: ???

bed_path: ${.${.dataset_name}.bed_path}
labels_path: ${oc.select:.${.dataset_name}.labels_path,null} # If there isn't a labels_path, set it to null
fasta_path: ${.${.dataset_name}.fasta_path}

decoder: ${.${.dataset_name}.decoder}
task_name: ${.${.dataset_name}.task_name}
task_loss: ${.${.dataset_name}.task_loss}

max_length: ${.${.dataset_name}.max_length}
d_output: ${.${.dataset_name}.classes}
use_padding: True
padding_side: left
add_eos: False
train_len: ${.${.dataset_name}.max_length}
__l_max: ${.max_length}
shuffle: true  # set this as default!
metric: ${.${.dataset_name}.metric}

# Details taken from BEND's paper, table 1
# The genome used was taken from https://anonymous.4open.science/r/BEND-8C42/conf/embedding/embed.yaml
cpg_methylation:
  bed_path: ${..dataset_dir}/cpg_methylation.bed
  metric: auroc
  max_length: 512
  classes: 2
  fasta_path: ${oc.env:PROJECT_ROOT}/data/hg38/GRCh38.primary_assembly.genome.fa
  task_name: multilabel
  task_loss: binary_cross_entropy
  decoder:
    _name_: sequence
    mode: pool

gene_finding:
  bed_path: ${..dataset_dir}/gene_finding.bed
  labels_path: ${..dataset_dir}/gene_finding.hdf5
  decoder_name: linear
  decoder_mode: null
  metric: mcc
  max_length: 14_000
  classes: 9
  fasta_path: ${oc.env:PROJECT_ROOT}/data/hg38/GRCh38.primary_assembly.genome.fa
  task_name: lm
  task_loss: cross_entropy
  decoder:
    _name_: bend_linear

variant_effects_disease:
  bed_path: ${..dataset_dir}/variant_effects_disease.bed
  metric: auroc
  max_length: 512
  fasta_path: ${oc.env:PROJECT_ROOT}/data/hg38/GRCh38.primary_assembly.genome.fa

variant_effects_expression:
  bed_path: ${..dataset_dir}/variant_effects_expression.bed
  metric: auroc
  max_length: 512
  fasta_path: ${oc.env:PROJECT_ROOT}/data/hg38/GRCh38.primary_assembly.genome.fa